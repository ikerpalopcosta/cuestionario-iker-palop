<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuestionario Aleatorio</title>
    <style>
      :root {
        --bg1: #1d4ed8;
        --bg2: #7c3aed;
        --bg3: #06b6d4;
        --panel: rgba(255, 255, 255, 0.96);
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --secondary: #f59e0b;
        --success: #22c55e;
        --danger: #ef4444;
        --text: #0f172a;
        --muted: #475569;
        --border: rgba(148, 163, 184, 0.35);
        --shadow: rgba(37, 99, 235, 0.24);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(251, 191, 36, 0.25), transparent 25%),
          radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.28), transparent 30%),
          linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 24px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: 0 22px 60px var(--shadow);
        padding: 32px;
        backdrop-filter: blur(8px);
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.08), rgba(168, 85, 247, 0.08), rgba(16, 185, 129, 0.06));
        pointer-events: none;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .header-badge {
        display: inline-block;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #1f2937;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 0.75rem;
        padding: 8px 14px;
        border-radius: 999px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2.2rem, 4vw, 3.2rem);
        line-height: 1.1;
        background: linear-gradient(135deg, #1d4ed8, #7c3aed, #0ea5e9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 24px;
        font-size: 1rem;
        line-height: 1.6;
        max-width: 760px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
      }

      button {
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), #3b82f6);
        color: #fff;
        cursor: pointer;
        font-size: 0.98rem;
        font-weight: 700;
        padding: 12px 20px;
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        box-shadow: 0 10px 18px rgba(37, 99, 235, 0.25);
      }

      button:hover {
        transform: translateY(-2px);
        filter: brightness(1.04);
      }

      #sendBtn {
        background: linear-gradient(135deg, #10b981, #059669);
        box-shadow: 0 10px 18px rgba(16, 185, 129, 0.25);
      }

      .questions {
        display: grid;
        gap: 18px;
      }

      .question {
        border: 1px solid var(--border);
        border-left: 6px solid #3b82f6;
        border-radius: 20px;
        padding: 20px 18px 18px;
        background: linear-gradient(135deg, #ffffff, #f8fbff);
        box-shadow: 0 10px 24px rgba(148, 163, 184, 0.18);
      }

      .question:nth-child(3n+2) {
        border-left-color: #8b5cf6;
      }

      .question:nth-child(3n) {
        border-left-color: #f59e0b;
      }

      .question h3 {
        margin: 0 0 12px;
        font-size: 1.08rem;
        line-height: 1.5;
        color: var(--text);
      }

      .options {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .option {
        width: 100%;
        text-align: left;
        background: linear-gradient(135deg, #ffffff, #eef6ff);
        color: var(--text);
        border: 1px solid rgba(96, 165, 250, 0.35);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.98rem;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      }

      .option:hover {
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
      }

      .option.selected {
        background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        border-color: #3b82f6;
        font-weight: 700;
      }

      .option.correct {
        background: linear-gradient(135deg, #dcfce7, #bbf7d0);
        border-color: var(--success);
        color: #166534;
      }

      .option.incorrect {
        background: linear-gradient(135deg, #fee2e2, #fecaca);
        border-color: var(--danger);
        color: #991b1b;
      }

      .visual-box {
        margin-top: 14px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(96, 165, 250, 0.35);
        background: linear-gradient(135deg, #eff6ff, #f8fafc);
      }

      .visual-box svg {
        display: block;
        width: 100%;
        height: 220px;
        border: none;
      }

      .meta {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 16px;
        font-weight: 600;
      }

      .result-box {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        background: linear-gradient(135deg, #ecfeff, #dbeafe);
        border: 1px solid rgba(14, 165, 233, 0.4);
        color: var(--text);
        font-size: 1rem;
        box-shadow: 0 10px 18px rgba(14, 165, 233, 0.12);
      }

      @media (max-width: 640px) {
        .card {
          padding: 20px;
        }

        .controls {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header-badge">Redes informáticas</div>
        <h1>Cuestionario</h1>
        <p class="subtitle">Responde las preguntas que aparecen. Cada vez se muestran 10 preguntas aleatorias de un total de 30 y tendrás que entregar la prueba al final.</p>

        <div class="controls">
          <button type="button" id="newQuestionsBtn">Generar otra tanda</button>
          <button type="button" id="sendBtn" style="background: #2f855a;">Entregar y corregir</button>
        </div>

        <div id="scoreSummary" class="meta">Puntuación máxima: 10 puntos</div>
        <div id="resultSummary" class="meta" style="margin-top: 8px; display: none;"></div>

        <form id="quizForm">
          <div id="questionsContainer" class="questions"></div>
        </form>
        <p class="meta">Autor: Iker Palop</p>
      </div>
    </div>

        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {

          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;

      function renderQuestions() {
        currentQuestions = shuffle(allQuestions).slice(0, 10);
        currentQuestions.forEach((question) => delete question.selected);
        questionsContainer.innerHTML = '';
        scoreSummary.textContent = 'Puntuación máxima: 10 puntos';
        resultSummary.style.display = 'none';
        resultSummary.textContent = '';

        currentQuestions.forEach((question, index) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'question';

          const title = document.createElement('h3');
          title.textContent = `${index + 1}. ${question.text}`;

          const optionsWrap = document.createElement('div');
          optionsWrap.className = 'options';

          question.options.forEach((option, optionIndex) => {
            const optionButton = document.createElement('button');
            optionButton.type = 'button';
            optionButton.className = 'option';
            optionButton.textContent = `${String.fromCharCode(65 + optionIndex)}) ${option}`;
            optionButton.addEventListener('click', () => {
              question.selected = optionIndex;
              const buttons = optionsWrap.querySelectorAll('.option');
              buttons.forEach((btn) => btn.classList.remove('selected'));
              optionButton.classList.add('selected');
            });
            optionsWrap.appendChild(optionButton);
          });

          if (question.visual) {
            const visualBox = document.createElement('div');
            visualBox.className = 'visual-box';
            visualBox.innerHTML = makeVisual(question.visual);
            wrapper.appendChild(visualBox);
          }

          wrapper.appendChild(title);
          wrapper.appendChild(optionsWrap);
          questionsContainer.appendChild(wrapper);
        });
      }

      newQuestionsBtn.addEventListener('click', renderQuestions);
      sendBtn.addEventListener('click', () => {
        let score = 0;

        currentQuestions.forEach((question, index) => {
          const questionElement = questionsContainer.children[index];
          const buttons = questionElement.querySelectorAll('.option');
          const selected = question.selected;

          if (selected === question.correct) {
            score += 1;
          }

          buttons.forEach((button, btnIndex) => {
            button.disabled = true;
            if (btnIndex === question.correct) {
              button.classList.add('correct');
            }
            if (selected !== undefined && btnIndex === selected && btnIndex !== question.correct) {
              button.classList.add('incorrect');
            }
          });
        });

        const evaluation = getEvaluation(score);
        resultSummary.style.display = 'block';
        resultSummary.className = 'result-box';
        resultSummary.innerHTML = `<strong>Resultado:</strong> ${score}/10 - <strong>${evaluation}</strong>`;
      });

      renderQuestions();
    </script>
